<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doom: Black Crusade Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        window.VITE_FIREBASE_API_KEY = "AIzaSyBVFjbiXDIQbgntZYeEDY3nB63zs8Q4gNk";
        window.VITE_FIREBASE_AUTH_DOMAIN = "bc-battle-tracker.firebaseapp.com";
        window.VITE_FIREBASE_PROJECT_ID = "bc-battle-tracker";
        window.VITE_FIREBASE_STORAGE_BUCKET = "bc-battle-tracker.firebasestorage.app";
        window.VITE_FIREBASE_MESSAGING_SENDER_ID = "666897001453";
        window.VITE_FIREBASE_APP_ID = "1:666897001453:web:0be0f79154f8e10b4115e4";
    </script>
</head>
<body class="grimdark-bg">

    <div class="tabs-container" style="margin-bottom: 20px;">
        <button class="tab-btn active" onclick="openTab(event, 'tracker-tab')">Трекер боя</button>
        <button class="tab-btn" onclick="openTab(event, 'guide-tab')">Гайд</button>
    </div>

    <div id="tracker-tab" class="tab-content active" style="display: block;">
        <h3>Активные сражения</h3>
        <div class="battle-setup">
            <input type="text" id="battle-name-input" placeholder="Название боя">
            <button id="btn-create-battle">Создать бой</button>
        </div>
        <div id="active-battles-list" style="margin-top: 20px;"></div>
    </div>

    <div id="guide-tab" class="tab-content" style="display: none;">
        <h3>Правила боя</h3>
        <p>Используйте этот раздел для быстрой справки по механикам Black Crusade.</p>
    </div>

    <script>
        function openTab(evt, tabId) {
            // Скрываем все блоки контента
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) {
                contents[i].style.display = "none";
                contents[i].classList.remove("active");
            }
            // Убираем класс active у всех кнопок
            const buttons = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove("active");
            }
            // Показываем нужный блок и делаем кнопку активной
            document.getElementById(tabId).style.display = "block";
            document.getElementById(tabId).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
