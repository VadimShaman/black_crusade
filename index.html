<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Crusade — Боевая комната</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Дополнительные стили для боевой комнаты */
        .battle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .battle-header h2 {
            color: var(--accent-glow);
            margin: 0;
        }

        .char-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.2s;
        }

        .char-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .char-item.active-turn {
            background: rgba(204, 51, 0, 0.2);
            border-left: 3px solid var(--accent-glow);
        }

        .char-item.dead {
            opacity: 0.35;
            text-decoration: line-through;
        }

        .char-name {
            font-weight: bold;
        }

        .char-wounds {
            font-size: 13px;
            color: #887777;
        }

        .char-wounds.low {
            color: #cc4444;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            background: #1a1414;
        }

        .status-badge.dead {
            background: #4a0000;
            color: #cc4444;
        }

        .status-badge.critical {
            background: #4a2a00;
            color: #ff8800;
        }

        .calc-panel {
            background: rgba(255, 255, 255, 0.02);
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .calc-result {
            margin-top: 12px;
            padding: 12px;
            background: #080505;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
        }

        .calc-result .hit {
            color: #66aa66;
        }

        .calc-result .miss {
            color: #cc4444;
        }

        .calc-result .crit {
            color: #ff8800;
            font-weight: bold;
        }

        .btn-attack {
            background: #4a0000;
            border-color: #7a0000;
            padding: 8px 20px;
        }

        .btn-attack:hover {
            background: #7a0000;
            border-color: var(--accent-glow);
        }

        .flex-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .flex-row select,
        .flex-row input {
            flex: 1;
            min-width: 100px;
        }

        .flex-row label {
            font-size: 12px;
            color: #887777;
        }

        .log-entry .time {
            color: #554444;
            margin-right: 8px;
        }

        .log-entry.damage {
            border-left: 2px solid #cc4444;
            padding-left: 8px;
        }

        .log-entry.system {
            border-left: 2px solid #446688;
            padding-left: 8px;
        }

        .log-entry.critical {
            border-left: 2px solid #ff8800;
            padding-left: 8px;
        }

        .battle-info {
            font-size: 14px;
            line-height: 1.8;
        }

        .battle-info strong {
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="container" style="max-width:1400px; margin:0 auto;">

        <!-- Шапка боевой комнаты -->
        <div class="battle-header">
            <h2>⚔️ <span id="battleNameDisplay">Бой</span></h2>
            <div class="flex-row" style="gap:8px;">
                <button class="tab-btn" id="rollInitiativeBtn">🎲 Инициатива</button>
                <button class="tab-btn" id="nextTurnBtn">⏩ Следующий ход</button>
                <button class="tab-btn btn-danger" id="finishBattleBtn">⛔ Завершить</button>
                <button class="tab-btn" id="exportBtn">📥 Экспорт</button>
                <button class="tab-btn" id="importBtn">📤 Импорт</button>
                <input type="file" id="importFile" accept=".json" style="display:none;">
                <a href="index.html" class="tab-btn">🏠 Выход</a>
            </div>
        </div>

        <!-- Статус и ID боя -->
        <div style="margin-bottom:16px; font-size:13px; color:#554444;">
            ID боя: <span id="battleIdDisplay" style="font-family:monospace;">—</span>
            | Раунд: <span id="turnDisplay">0</span>
            | Ход: <span id="currentTurnDisplay">—</span>
            | Активных: <span id="activeChars">0</span>
        </div>

        <!-- Основная сетка -->
        <div class="grid-two">
            <!-- Левая колонка: персонажи и инициатива -->
            <div>
                <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
                    <select id="npcTemplateSelect" style="flex:1;">
                        <option value="cultist">Культист</option>
                        <option value="beastman">Зверолюд</option>
                        <option value="albino">Альбинос (босс)</option>
                        <option value="flamingPredator">Пылающий Хищник</option>
                        <option value="gregor">Грегор Мясник</option>
                    </select>
                    <button class="tab-btn" id="addNpcBtn">➕ NPC</button>
                    <button class="tab-btn" id="addPlayerBtn">➕ Игрок</button>
                </div>

                <h4 style="border-bottom:1px solid var(--border-color); padding-bottom:6px;">👥 Очередь инициативы</h4>
                <div id="initiativeList" class="init-list">
                    <span style="color:#554444;">Нет персонажей</span>
                </div>

                <div style="margin-top:12px; background:rgba(255,255,255,0.02); padding:12px; border-radius:4px;">
                    <div style="font-size:13px; color:#887777;">💡 Нажми на персонажа, чтобы выбрать его для атаки</div>
                </div>
            </div>

            <!-- Правая колонка: калькулятор + лог -->
            <div>
                <!-- Калькулятор атаки -->
                <div class="calc-panel">
                    <h4 style="margin-top:0;">⚔️ Калькулятор атаки</h4>
                    <div class="flex-row">
                        <select id="attackerSelect">
                            <option value="">Атакующий</option>
                        </select>
                        <span>➔</span>
                        <select id="defenderSelect">
                            <option value="">Цель</option>
                        </select>
                    </div>
                    <div class="flex-row" style="margin-top:8px;">
                        <select id="weaponSelect">
                            <option value="default">Оружие</option>
                            <option value="Кулак">Кулак</option>
                            <option value="Когти">Когти</option>
                            <option value="Мясницкий тесак">Мясницкий тесак</option>
                            <option value="Ритуальный нож">Ритуальный нож</option>
                            <option value="Огненные когти">Огненные когти</option>
                            <option value="Автопистолет">Автопистолет</option>
                            <option value="Тяжёлый автопистолет">Тяжёлый автопистолет</option>
                            <option value="Теневая магия">Теневая магия</option>
                        </select>
                        <input type="number" id="rangeMod" value="0" placeholder="Мод" style="width:60px;">
                        <label><input type="checkbox" id="fullAttackCheck"> +10</label>
                        <label><input type="checkbox" id="allOutAttackCheck"> +30</label>
                    </div>
                    <button class="tab-btn btn-attack" id="attackBtn" style="width:100%; margin-top:8px;">💥
                        Атаковать!</button>
                    <div id="calcResult" class="calc-result" style="display:none;"></div>
                </div>

                <!-- Лог боя -->
                <h4 style="margin-top:16px; border-bottom:1px solid var(--border-color); padding-bottom:6px;">📜
                    Варп-лог</h4>
                <div id="logContainer" class="log-container">
                    <span style="color:#554444;">Ожидание подключения...</span>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
    }
}
</script>

    <script type="module" src="js/battle-init.js"></script>
</body>

</html>
